# Debug overlay for docker-compose.yml — adds a Delve (Go debugger) port to
# the prebid-server service without touching the normal build/run path.
# Bring the stack up with (or just run ./start-debug.sh):
#
#   docker compose -f docker-compose.yml -f docker-compose.debug.yml up -d --build
#
# Tear down exactly as usual — ./stop.sh / `docker compose down` — the
# service and container names are unchanged; this file only swaps which
# Dockerfile builds the prebid-server image and publishes Delve's port.
# Only one variant (normal or debug) can run at a time, since both bind the
# same host ports/container name.
#
# The image must run natively on the host's architecture: Delve's
# ptrace-based breakpoints are unreliable under Rosetta 2 emulation (see
# docs/RETROSPECTIVE-delve-debugging.md). docker-compose.yml no longer pins a
# platform for prebid-server, so no override is needed here.
services:
  prebid-server:
    build:
      dockerfile: prebid-server/Dockerfile.debug
    ports:
      - "2345:2345"   # Delve — attach from VS Code (see .vscode/launch.json)
