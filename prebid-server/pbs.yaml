port: 8000
admin_port: 6060

# Multi-tenant: every request must resolve to a known publisher account
# (app.publisher.id / site.publisher.id) or PBS rejects it outright, rather
# than silently falling back to global defaults. This is the config flag
# that turns "single mock exchange" into "hub with isolated publishers."
account_required: true

accounts:
  filesystem:
    enabled: true
    directorypath: ./stored_requests/data/by_id/accounts

gdpr:
  default_value: "0"

stored_requests:
  filesystem:
    enabled: true
    directorypath: ./stored_requests/data/by_id

stored_responses:
  filesystem:
    enabled: true
    directorypath: ./stored_requests/data/by_id

# Prebid Cache: VAST responses are POSTed here and returned as a
# hb_cache_id/hb_uuid targeting key + cache URL instead of inline XML, once
# a request sets ext.prebid.cache.vastxml: {}. See prebid-cache service in
# docker-compose.yml (default in-memory backend, port 2424).
cache:
  scheme: http
  host: prebid-cache:2424
  query: uuid=%PBS_CACHE_UUID%
  default_ttl_seconds:
    video: 3600

# Pre-auction hooks: Bouncer (entrypoint-stage bad-IP bloom filter) and
# Enricher (raw_auction_request-stage identity decoration). See
# modules/ortbvast/{bouncer,enricher}/module.go and ARCHITECTURE.md §4.
#
# VERIFY BEFORE RUNNING: this YAML shape mirrors the JSON example in
# docs.prebid.org/prebid-server/developers/add-a-module-go.html; the exact
# key names (in particular whether it's `host_execution_plan` at the top
# level or nested under an account/endpoint-specific plan for this PBS
# version) should be cross-checked against the vendored config docs for
# whatever tag Dockerfile actually builds, and adjusted if PBS logs a
# config parse warning/error on startup.
hooks:
  enabled: true
  modules:
    ortbvast:
      bouncer:
        enabled: true
        blocklist_path: /etc/config/bouncer-blocklist.txt
        false_positive_rate: 0.001
        nbr_code: 2
      enricher:
        enabled: true
        profile_store_path: /etc/config/enricher-profiles.json
        segment_provider: ortbvast-mock-idsp
  host_execution_plan:
    endpoints:
      /openrtb2/auction:
        stages:
          entrypoint:
            groups:
              - timeout: 5
                hook_sequence:
                  - module_code: ortbvast.bouncer
                    hook_impl_code: bouncer-entrypoint
          raw_auction_request:
            groups:
              - timeout: 10
                hook_sequence:
                  - module_code: ortbvast.enricher
                    hook_impl_code: enricher-raw-auction-request
